# Edge (архитектура 8, E02-02.6): TLS, маршрутизация, rate limit. Самоподписанный сертификат — только dev.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    # Адреса сервисов резолвятся через DNS Docker при каждом запросе: после перезапуска контейнера
    # IP меняется, а закешированный nginx-ом адрес вёл бы в никуда
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    log_format main '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Rate limit на API: 20 запросов в секунду с адреса, всплеск до 40
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Заголовки безопасности (add_header в location не используется: он бы отменил эти)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 10m;  # DOC-01: файл до 10 МБ

        # Проверка живости самого edge
        location = /edge/health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # REST и SSE ядра. SSE не буферизуется, соединение живёт до часа (событие ping раз в 15 с)
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            set $core_api core-api;
            proxy_pass http://$core_api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        # Кабинет (серверный рендеринг)
        location / {
            set $web web;
            proxy_pass http://$web:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
