[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cabinet-common",
    "cabinet-contracts",
    "cabinet-featurebuilder",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]
