[project]
name = "doc-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cabinet-common",
    "cabinet-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_service"]
