[project]
name = "web"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cabinet-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cabinet_web"]
