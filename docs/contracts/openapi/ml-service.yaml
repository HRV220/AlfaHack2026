openapi: 3.1.0
info:
  title: ml-service — внутренний API
  version: 1.0.0
  description: |
    Синхронные расчёты для core-api (архитектура 13.3). Доступ только из внутренней сети Compose, без аутентификации пользователя.
    Каждый запрос передаёт заголовок `traceparent`. Расчёт подбора, what-if и скоринга детерминирован (REC-09).
    Асинхронная часть (скоринг заявки, прогноз, категоризация, пересчёт профиля) работает через события — см. contracts/events.
servers:
  - url: http://ml-service:8080
paths:
  /health:
    get:
      operationId: health
      summary: Готовность и загруженные версии
      responses:
        '200':
          description: Готов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Models'}
  /models:
    get:
      operationId: getModels
      summary: Версии моделей и конфигурации (champion и challenger)
      responses:
        '200':
          description: Версии
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Models'}
  /profile/{inn}:
    get:
      operationId: getProfile
      summary: Профиль для подбора (PRF-01…PRF-10)
      parameters:
        - name: inn
          in: path
          required: true
          schema: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
      responses:
        '200':
          description: Профиль; p95 ≤ 300 мс
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/Profile'}
        '404': {$ref: '#/components/responses/Problem'}
  /recommend:
    post:
      operationId: recommend
      summary: Полный подбор — допуск, расчёт, ранжирование, альтернативы (REC-01…REC-08); p95 ≤ 3 с
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inn, need]
              properties:
                inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
                need: {$ref: '../schemas/domain.schema.json#/$defs/Need'}
      responses:
        '200':
          description: Тело снимка; id и trigger присваивает core-api
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/RecommendationBody'}
        '422': {$ref: '#/components/responses/Problem'}
  /recommend/probe:
    post:
      operationId: recommendProbe
      summary: Чувствительность подбора к полям со значениями по умолчанию для QuestionPlanner (NEED-05); p95 ≤ 1 с
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inn, need, fields]
              properties:
                inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
                need: {$ref: '../schemas/domain.schema.json#/$defs/Need'}
                fields:
                  type: array
                  minItems: 1
                  items: {$ref: '../schemas/domain.schema.json#/$defs/NeedField'}
      responses:
        '200':
          description: Для каждого поля — сколько пробных значений меняют лучший продукт
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [best_product_code, decisive_field, per_field]
                properties:
                  best_product_code:
                    anyOf:
                      - $ref: '../schemas/domain.schema.json#/$defs/ProductCode'
                      - type: 'null'
                  decisive_field:
                    description: Поле для следующего вопроса; null — спрашивать нечего
                    anyOf:
                      - $ref: '../schemas/domain.schema.json#/$defs/NeedField'
                      - type: 'null'
                  per_field:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [field, probe_values, changes]
                      properties:
                        field: {$ref: '../schemas/domain.schema.json#/$defs/NeedField'}
                        probe_values: {type: array, items: {}}
                        changes: {type: integer, minimum: 0, description: 'Число пробных значений, при которых меняется лучший продукт'}
  /recommend/why-not:
    post:
      operationId: whyNot
      summary: Причина для продукта по снимку (REC-14); p95 ≤ 300 мс
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recommendation, product_code]
              properties:
                recommendation: {$ref: '../schemas/domain.schema.json#/$defs/RecommendationBody'}
                product_code: {$ref: '../schemas/domain.schema.json#/$defs/ProductCode'}
      responses:
        '200':
          description: Причина
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/WhyNot'}
  /score:
    post:
      operationId: score
      summary: Скоринг заявки синхронно — тот же расчёт, что у обработчика application.submitted (SC-01…SC-07); p95 ≤ 150 мс
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScoreRequest'}
      responses:
        '200':
          description: Снимок решения
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/DecisionBody'}
  /what-if:
    post:
      operationId: whatIf
      summary: Перебор изменений и до 3 вариантов (WI-02…WI-04); p95 ≤ 1 с
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inn, need, base]
              properties:
                inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
                need: {$ref: '../schemas/domain.schema.json#/$defs/Need'}
                base:
                  type: object
                  additionalProperties: false
                  required: [product_code, amount, term_months]
                  properties:
                    product_code: {$ref: '../schemas/domain.schema.json#/$defs/ProductCode'}
                    amount: {$ref: '../schemas/domain.schema.json#/$defs/Money'}
                    term_months: {type: integer, minimum: 1}
      responses:
        '200':
          description: Варианты; id вариантов присваивает ml-service, core-api их сохраняет
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/WhatIfResult'}
  /terms/evaluate:
    post:
      operationId: termsEvaluate
      summary: Расчёт условий для заданных суммы и срока — ставка, платёж, переплата, PD, график (UW-06, APP-10); p95 ≤ 100 мс
      description: |
        Те же формулы REC-02–REC-05 и та же PD-модель, что в подборе и решении (РШ-2). Сумма и срок должны лежать
        в границах продукта, иначе 422 VALIDATION_ERROR. Не зависит от расширения S1 и доступен всегда.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inn, product_code, amount, term_months]
              properties:
                inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
                product_code: {$ref: '../schemas/domain.schema.json#/$defs/ProductCode'}
                amount: {$ref: '../schemas/domain.schema.json#/$defs/Money'}
                term_months: {type: integer, minimum: 1}
      responses:
        '200':
          description: Условия
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/TermsEvaluation'}
        '422':
          description: VALIDATION_ERROR — сумма или срок вне границ продукта
          content:
            application/problem+json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/Problem'}
  /what-if/evaluate:
    post:
      operationId: whatIfEvaluate
      summary: Одна комбинация (WI-05); p95 ≤ 100 мс
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inn, need, base, changes]
              properties:
                inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
                need: {$ref: '../schemas/domain.schema.json#/$defs/Need'}
                base:
                  type: object
                  additionalProperties: false
                  required: [product_code, amount, term_months]
                  properties:
                    product_code: {$ref: '../schemas/domain.schema.json#/$defs/ProductCode'}
                    amount: {$ref: '../schemas/domain.schema.json#/$defs/Money'}
                    term_months: {type: integer, minimum: 1}
                changes: {$ref: '../schemas/domain.schema.json#/$defs/WhatIfChanges'}
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/WhatIfEvaluation'}
  /cashflow/{inn}/summary:
    get:
      operationId: cashflowSummary
      summary: Финансовый пульс (CF-01, CF-02)
      parameters:
        - name: inn
          in: path
          required: true
          schema: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/CashflowSummary'}
  /cashflow/{inn}/forecast:
    get:
      operationId: cashflowForecast
      summary: Последний прогноз (CF-03)
      parameters:
        - name: inn
          in: path
          required: true
          schema: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
        - name: horizon
          in: query
          schema: {type: integer, enum: [30, 60, 90], default: 90}
      responses:
        '200':
          description: Прогноз
          content:
            application/json:
              schema: {$ref: '../schemas/domain.schema.json#/$defs/Forecast'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  schemas:
    ScoreRequest:
      type: object
      additionalProperties: false
      required: [application_id, application_version, inn, recommendation_id, params, has_unverified_statement, has_client_edits]
      properties:
        application_id: {$ref: '../schemas/domain.schema.json#/$defs/Uuid'}
        application_version: {type: integer, minimum: 1}
        inn: {$ref: '../schemas/domain.schema.json#/$defs/Inn'}
        recommendation_id: {$ref: '../schemas/domain.schema.json#/$defs/Uuid'}
        params: {$ref: '../schemas/domain.schema.json#/$defs/ApplicationParams'}
        has_unverified_statement: {type: boolean}
        has_client_edits: {type: boolean}
    Models:
      type: object
      additionalProperties: false
      required: [champion, challenger, config]
      properties:
        champion: {type: object, additionalProperties: {$ref: '../schemas/domain.schema.json#/$defs/Version'}, description: 'pd, forecast, categorizer'}
        challenger: {type: object, additionalProperties: {$ref: '../schemas/domain.schema.json#/$defs/Version'}}
        config: {$ref: '../schemas/domain.schema.json#/$defs/ConfigVersions'}
  responses:
    Problem:
      description: Ошибка RFC 9457
      content:
        application/problem+json:
          schema: {$ref: '../schemas/domain.schema.json#/$defs/Problem'}
