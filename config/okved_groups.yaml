# ОКВЭД 2 → отраслевая группа (ТЗ PRF-02, раздел 6). Словарь общий для генератора, моделей и каталога.
# classes — двузначные классы ОКВЭД: "47" или диапазон "10-33". Классы, не вошедшие в G01–G11,
# относятся к группе default (G12). Коды групп — IndustryGroup из domain.schema.json.
version: "1.0.0"
default_group: G12
groups:
  - {group: G01, name: "Розничная торговля", classes: ["47"]}
  - {group: G02, name: "Оптовая торговля", classes: ["45", "46"]}
  - {group: G03, name: "Гостиницы и общепит", classes: ["55", "56"]}
  - {group: G04, name: "Производство", classes: ["10-33"]}
  - {group: G05, name: "Строительство", classes: ["41-43"]}
  - {group: G06, name: "Транспорт и логистика", classes: ["49-53"]}
  - {group: G07, name: "Сельское хозяйство", classes: ["01-03"]}
  - {group: G08, name: "IT и связь", classes: ["58-63"]}
  - {group: G09, name: "Профессиональные и административные услуги", classes: ["69-75", "77-82"]}
  - {group: G10, name: "Бытовые, персональные и развлекательные услуги", classes: ["90-96"]}
  - {group: G11, name: "Здравоохранение и образование", classes: ["85-88"]}
  - {group: G12, name: "Другие отрасли", classes: []}
