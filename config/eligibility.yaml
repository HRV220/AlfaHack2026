# Правила допуска (ТЗ SC-01, REC-01, REC-04, 4.3, CAT-05). Каждое правило ссылается на код причины
# из справочника reason codes (ReasonCode в domain.schema.json). Тексты для клиента — reason_codes.yaml.
version: "1.0.0"

# CAT-05: все 6 продуктов доступны ИП и ООО
opf: [IP, LLC]

# Стоп-факторы: отказ без расчёта PD (SC-01)
stop_factors:
  registry: {reason_code: STOP_REGISTRY, allowed_statuses: [ACTIVE]}
  fraud: {reason_code: STOP_FRAUD}
  overdue: {reason_code: STOP_OVERDUE, over_days: 60, window_months: 12}  # просрочка > 60 дней за 12 мес.
  young: {reason_code: STOP_YOUNG, below_months: 6}                       # бизнесу < 6 мес.

# Общие правила допуска продукта (REC-01)
rules:
  goal: {reason_code: GOAL_MISMATCH}                  # значение матрицы «цель × продукт» = 0
  amount_min: {reason_code: AMOUNT_BELOW_MIN}         # нужная сумма меньше минимума продукта
  collateral: {reason_code: COLLATERAL_REQUIRED}      # продукт требует залог, залог не указан
  age: {reason_code: AGE_BELOW_MIN}                   # возраст бизнеса меньше условия продукта
  inflow: {reason_code: INFLOW_BELOW_MIN}             # средние поступления меньше условия продукта
  inflow_history: {reason_code: INFLOW_HISTORY_SHORT} # поступления есть не во всех последних месяцах
  industry: {reason_code: INDUSTRY_NOT_IN_PROGRAM}    # отраслевая группа не входит в программу
  capacity: {reason_code: CAPACITY_BELOW_MIN}         # лимит по платёжеспособности меньше минимума

# Параметры лимита по платёжеспособности (REC-04)
capacity:
  payment_share_of_sdp: 0.5     # допустимый платёж = 0,5 × СДП − текущие платежи (P2–P6)
  overdraft_share_of_inflow: 0.5 # P1: лимит = 50% средних поступлений за 6 мес. итого

# Условия допуска по продуктам (ТЗ 4.3); не указано — условия нет
products:
  P1: {inflow_each_of_last_months: 6}
  P2: {min_business_age_months: 6}
  P3: {min_business_age_months: 12, min_avg_inflow_6m: 1000000}
  P4: {min_business_age_months: 12}
  P5: {collateral_value_required: true}
  P6: {min_business_age_months: 12, industry_groups: [G04, G07, G08, G11]}
